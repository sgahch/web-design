  <line x1="600" y1="80" x2="580" y2="65" stroke="#FFD600" stroke-width="3" opacity="0.5"/>
  <line x1="580" y1="140" x2="560" y2="140" stroke="#FFD600" stroke-width="3" opacity="0.5"/>
