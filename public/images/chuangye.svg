  <path d="M630,180 L690,180 L680,200 L640,200 Z" fill="none" stroke="#FFD600" stroke-width="3"/>
  <line x1="645" y1="200" x2="645" y2="215" stroke="#FFD600" stroke-width="2"/>
  <line x1="660" y1="200" x2="660" y2="220" stroke="#FFD600" stroke-width="2"/>
  <line x1="675" y1="200" x2="675" y2="215" stroke="#FFD600" stroke-width="2"/>
