<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="40" y1="0" x2="40" y2="40" stroke="#333" stroke-width="0.5" opacity="0.2"/>
      <line x1="0" y1="40" x2="40" y2="40" stroke="#333" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <!-- 装饰色块 -->
  <rect x="0" y="340" width="800" height="60" fill="#FFD600"/>
  <rect x="600" y="0" width="200" height="340" fill="#FFD600" opacity="0.06"/>
  <!-- 数学公式装饰 -->
  <text x="480" y="70" fill="#FFD600" font-family="serif" font-size="28" opacity="0.35" font-style="italic">∫ f(x)dx</text>
  <text x="520" y="120" fill="#FFD600" font-family="serif" font-size="22" opacity="0.3">Σ aₙxⁿ</text>
  <text x="500" y="160" fill="#FFD600" font-family="serif" font-size="20" opacity="0.25">∂²u/∂t² = c²∇²u</text>
  <text x="550" y="200" fill="#FFD600" font-family="serif" font-size="24" opacity="0.2">lim x→∞</text>
  <!-- 坐标系装饰 -->
  <line x1="560" y1="280" x2="760" y2="280" stroke="#FFD600" stroke-width="2" opacity="0.4"/>
  <line x1="560" y1="280" x2="560" y2="220" stroke="#FFD600" stroke-width="2" opacity="0.4"/>
  <path d="M580,275 Q620,230 660,250 T740,235" fill="none" stroke="#FFD600" stroke-width="2.5" opacity="0.5"/>
  <!-- 大图标 -->
  <circle cx="160" cy="160" r="100" fill="none" stroke="#FFD600" stroke-width="4"/>
  <text x="160" y="145" text-anchor="middle" fill="#FFD600" font-family="serif" font-size="56" font-weight="900">f(x)</text>
  <text x="160" y="195" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="16" font-weight="700">MODEL</text>
  <!-- 标题 -->
  <text x="40" y="320" fill="#fff" font-family="system-ui" font-size="42" font-weight="900" letter-spacing="2">数学建模</text>
  <text x="40" y="290" fill="#FFD600" font-family="system-ui" font-size="20" font-weight="700">全国大学生数学建模竞赛</text>
  <!-- 底部标签 -->
  <text x="40" y="370" fill="#0a0a0a" font-family="system-ui" font-size="16" font-weight="900">数学建模 · 论文写作 · 三天奋战</text>
</svg>
