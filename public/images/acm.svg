<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <pattern id="code-lines" x="0" y="0" width="800" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="19" x2="800" y2="19" stroke="#333" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2" fill="#FFD600" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  <rect width="800" height="400" fill="url(#code-lines)"/>
  <!-- 装饰 -->
  <rect x="0" y="340" width="800" height="60" fill="#FFD600"/>
  <rect x="0" y="0" width="120" height="400" fill="#FFD600" opacity="0.08"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  <!-- 代码装饰 -->
  <text x="40" y="80" fill="#FFD600" font-family="monospace" font-size="14" opacity="0.4">#include &lt;bits/stdc++.h&gt;</text>
  <text x="40" y="105" fill="#FFD600" font-family="monospace" font-size="14" opacity="0.3">using namespace std;</text>
  <text x="40" y="130" fill="#FFD600" font-family="monospace" font-size="14" opacity="0.25">int main() {</text>
  <text x="40" y="155" fill="#FFD600" font-family="monospace" font-size="14" opacity="0.2">  solve();</text>
  <text x="40" y="180" fill="#FFD600" font-family="monospace" font-size="14" opacity="0.15">}</text>
  <text x="600" y="300" fill="#FFD600" font-family="monospace" font-size="12" opacity="0.3">// AC ✓</text>
  <text x="600" y="320" fill="#FFD600" font-family="monospace" font-size="12" opacity="0.2">// Time: 42ms</text>
  <!-- 左侧大图标 -->
  <rect x="520" y="60" width="220" height="180" fill="none" stroke="#FFD600" stroke-width="4"/>
  <text x="630" y="130" text-anchor="middle" fill="#FFD600" font-family="system-ui" font-size="64" font-weight="900">&lt;/&gt;</text>
  <text x="630" y="185" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="20" font-weight="700">ALGORITHM</text>
  <!-- 标题 -->
  <text x="40" y="260" fill="#fff" font-family="system-ui" font-size="52" font-weight="900" letter-spacing="2">ACM-ICPC</text>
  <text x="40" y="300" fill="#FFD600" font-family="system-ui" font-size="24" font-weight="700">国际大学生程序设计竞赛</text>
  <!-- 底部标签 -->
  <text x="40" y="370" fill="#0a0a0a" font-family="system-ui" font-size="16" font-weight="900">三人一队 · 算法对决 · 全球赛场</text>
</svg>
